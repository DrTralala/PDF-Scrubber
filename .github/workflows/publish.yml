name: Publish npm package

on:
  release:
    types: [published]

concurrency:
  group: publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish npm package
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.release.tag_name }}
      - name: Verify release target SHA
        run: |
          checked_out_sha=$(git rev-parse HEAD)
          release_tag_sha=$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")
          test "$checked_out_sha" = "$release_tag_sha"
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.18.0'
          registry-url: https://registry.npmjs.org
      - name: Check release version
        run: |
          package_name=$(node -p "require('./apps/cli/package.json').name")
          package_version=$(node -p "require('./apps/cli/package.json').version")
          test "$RELEASE_TAG" = "v$package_version"
          if npm view "$package_name@$package_version" version >/dev/null 2>&1; then
            echo "$package_name@$package_version already exists" >&2
            exit 1
          fi
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Install Poppler
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y poppler-utils
      - name: Verify release
        run: npm run verify:release
      - name: Publish npm package
        run: npm publish --workspace pdf-scrubber
