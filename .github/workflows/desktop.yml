name: Windows portable

on:
  workflow_dispatch:
    inputs:
      editor_tag:
        description: Stable editor tag to package (for example, v1.0.0)
        required: true
        type: string
      lock_diagnostics:
        description: On manual runs, use Microsoft Sysinternals Handle if portable-app relocation fails
        required: false
        default: false
        type: boolean
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.event.release.tag_name || inputs.editor_tag || github.sha }}
  cancel-in-progress: false

jobs:
  build:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'release' && !github.event.release.prerelease) }}
    runs-on: windows-latest
    permissions:
      contents: read
    outputs:
      editor_tag: ${{ steps.identities.outputs.editor_tag }}
      editor_version: ${{ steps.identities.outputs.editor_version }}
      editor_sha: ${{ steps.identities.outputs.editor_sha }}
      packaging_sha: ${{ steps.identities.outputs.packaging_sha }}
      artifact_name: ${{ steps.identities.outputs.artifact_name }}
    steps:
      - name: Check out packaging revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Resolve and validate editor tag
        id: tag
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_TAG: ${{ inputs.editor_tag }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if ($env:EVENT_NAME -eq 'release') {
            $tag = $env:RELEASE_TAG
          } else {
            $tag = $env:DISPATCH_TAG
          }
          if ($tag -notmatch '^v((0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*))$') {
            throw 'Editor tag must be an unprefixed stable vMAJOR.MINOR.PATCH tag.'
          }
          "editor_tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Check out tagged editor source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ steps.tag.outputs.editor_tag }}
          path: editor-source
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.1'

      - name: Resolve and verify source identities
        id: identities
        shell: pwsh
        working-directory: editor-source
        env:
          EDITOR_TAG: ${{ steps.tag.outputs.editor_tag }}
          EVENT_NAME: ${{ github.event_name }}
          EXPECTED_RELEASE_SHA: ${{ github.sha }}
        run: |
          $packagingSha = (git -C $env:GITHUB_WORKSPACE rev-parse HEAD).Trim()
          $editorHead = (git rev-parse HEAD).Trim()
          $editorSha = (git rev-parse "refs/tags/$env:EDITOR_TAG^{commit}").Trim()
          if ($editorHead -ne $editorSha) {
            throw 'The editor checkout does not match the selected tag target.'
          }
          $editorVersion = (node -p "require('./apps/cli/package.json').version").Trim()
          if ("v$editorVersion" -ne $env:EDITOR_TAG) {
            throw "Editor tag $env:EDITOR_TAG does not match apps/cli/package.json version $editorVersion."
          }
          if ($env:EVENT_NAME -eq 'release' -and (
            $editorSha -ne $env:EXPECTED_RELEASE_SHA -or $packagingSha -ne $env:EXPECTED_RELEASE_SHA
          )) {
            throw 'Stable release packaging and editor sources must both match the published release SHA.'
          }
          $artifactName = "pdf-scrubber-$editorVersion-windows-x64-portable"
          "editor_tag=$env:EDITOR_TAG" >> $env:GITHUB_OUTPUT
          "editor_version=$editorVersion" >> $env:GITHUB_OUTPUT
          "editor_sha=$editorSha" >> $env:GITHUB_OUTPUT
          "packaging_sha=$packagingSha" >> $env:GITHUB_OUTPUT
          "artifact_name=$artifactName" >> $env:GITHUB_OUTPUT

      - name: Install desktop wrapper dependencies
        working-directory: .
        run: npm ci

      - name: Generate synthetic product smoke fixtures
        working-directory: .
        run: npm run build:fixtures

      - name: Install tagged editor dependencies
        working-directory: editor-source
        run: npm ci

      - name: Build editor assets from selected tag
        working-directory: editor-source
        env:
          VITE_WINDOWS_PORTABLE: 'true'
        run: npm run build --workspace @pdf-editor/web -- --outDir ../../artifacts/desktop/editor-assets --emptyOutDir

      - name: Prepare desktop package
        shell: pwsh
        env:
          EDITOR_TAG: ${{ steps.identities.outputs.editor_tag }}
          EDITOR_VERSION: ${{ steps.identities.outputs.editor_version }}
        run: |
          $editorAssets = Join-Path $env:GITHUB_WORKSPACE 'editor-source/artifacts/desktop/editor-assets'
          npm run desktop:prepare -- --editor-assets $editorAssets --editor-tag $env:EDITOR_TAG --editor-version $env:EDITOR_VERSION --output artifacts/desktop/package-input
          if ($LASTEXITCODE -ne 0) { throw 'Desktop packaging preparation failed.' }

      - name: Build unsigned Windows x64 portable executable
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run build:portable --workspace @pdf-editor/desktop

      - name: Prepare Microsoft Sysinternals Handle for optional relocation diagnostics
        id: handle
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.lock_diagnostics }}
        shell: pwsh
        env:
          PDF_SCRUBBER_RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          if ($env:PDF_SCRUBBER_RUNNER_ENVIRONMENT -ne 'github-hosted') {
            throw 'Handle diagnostics are restricted to an ephemeral GitHub-hosted runner.'
          }
          $identity = [Security.Principal.WindowsIdentity]::GetCurrent()
          $principal = [Security.Principal.WindowsPrincipal]::new($identity)
          if (-not $principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)) {
            throw 'Handle diagnostics require an administrator token on the ephemeral runner.'
          }

          $availableHandle = Get-Command 'Handle64.exe' -CommandType Application -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if ($null -eq $availableHandle) {
            $toolRoot = [IO.Path]::GetFullPath((Join-Path $env:RUNNER_TEMP "pdf-scrubber-handle-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"))
            if (Test-Path -LiteralPath $toolRoot) {
              throw 'Refusing to reuse an existing Handle diagnostic temporary directory.'
            }
            New-Item -ItemType Directory -Path $toolRoot -ErrorAction Stop | Out-Null
            "cleanup_root=$toolRoot" >> $env:GITHUB_OUTPUT
            $archive = Join-Path $toolRoot 'Handle.zip'
            $extractRoot = Join-Path $toolRoot 'extracted'
            Invoke-WebRequest -Uri 'https://download.sysinternals.com/files/Handle.zip' -OutFile $archive
            Expand-Archive -LiteralPath $archive -DestinationPath $extractRoot -ErrorAction Stop
            $handleExecutable = Join-Path $extractRoot 'Handle64.exe'
          } else {
            $handleExecutable = $availableHandle.Source
          }

          if (-not (Test-Path -LiteralPath $handleExecutable -PathType Leaf)) {
            throw 'The 64-bit Microsoft Sysinternals Handle executable is unavailable.'
          }
          $signature = Get-AuthenticodeSignature -FilePath $handleExecutable
          $signerName = if ($null -eq $signature.SignerCertificate) {
            ''
          } else {
            $signature.SignerCertificate.GetNameInfo(
              [Security.Cryptography.X509Certificates.X509NameType]::SimpleName,
              $false
            )
          }
          if ($signature.Status.ToString() -ne 'Valid' -or $signerName -ne 'Microsoft Corporation') {
            throw "Handle Authenticode verification failed (status=$($signature.Status), signer=$signerName)."
          }
          $fileVersion = (Get-Item -LiteralPath $handleExecutable).VersionInfo.FileVersion
          $productVersion = (Get-Item -LiteralPath $handleExecutable).VersionInfo.ProductVersion
          $sha256 = (Get-FileHash -LiteralPath $handleExecutable -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "Sysinternals Handle64 FileVersion=$fileVersion ProductVersion=$productVersion SHA256=$sha256"

          $binaryBytes = [IO.File]::ReadAllBytes($handleExecutable)
          $asciiStrings = [Text.Encoding]::ASCII.GetString($binaryBytes)
          $unicodeStrings = [Text.Encoding]::Unicode.GetString($binaryBytes)
          $supportsAcceptEula = $asciiStrings -match '(?i)-accepteula' -or
            $unicodeStrings -match '(?i)-accepteula'
          $probeArguments = [Collections.Generic.List[string]]::new()
          if ($supportsAcceptEula) { $probeArguments.Add('-accepteula') }
          $probeName = "pdf-scrubber-handle-preflight-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $probeArguments.Add('-a')
          $probeArguments.Add($probeName)

          $startInfo = [Diagnostics.ProcessStartInfo]::new()
          $startInfo.FileName = [IO.Path]::GetFullPath($handleExecutable)
          $startInfo.Arguments = $probeArguments -join ' '
          $startInfo.UseShellExecute = $false
          $startInfo.CreateNoWindow = $true
          $startInfo.RedirectStandardOutput = $true
          $startInfo.RedirectStandardError = $true
          $probeProcess = [Diagnostics.Process]::new()
          $probeProcess.StartInfo = $startInfo
          try {
            if (-not $probeProcess.Start()) { throw 'Handle selected-argument preflight could not start.' }
            $stdoutTask = $probeProcess.StandardOutput.ReadToEndAsync()
            $stderrTask = $probeProcess.StandardError.ReadToEndAsync()
            if (-not $probeProcess.WaitForExit(10000)) {
              $probeProcess.Kill()
              [void]$probeProcess.WaitForExit(5000)
              throw 'Handle selected-argument preflight exceeded 10 seconds.'
            }
            $probeProcess.WaitForExit()
            $probeOutput = $stdoutTask.GetAwaiter().GetResult() + $stderrTask.GetAwaiter().GetResult()
            if ($probeOutput.Length -gt 65536) {
              throw 'Handle selected-argument preflight exceeded its 64 KiB output limit.'
            }
            $preflightLines = @(
              ($probeOutput -split '\r?\n') |
                ForEach-Object { $_.Trim() } |
                Where-Object { $_.Length -gt 0 }
            )
            $canonicalNoMatch = 'No matching handles found.'
            $acceptedExitCodes = @(0, 1)
            $hasCanonicalNoMatch = $preflightLines -ccontains $canonicalNoMatch
            $acceptedExitCode = $probeProcess.ExitCode -in $acceptedExitCodes
            $hasPreflightError = @(
              $preflightLines | Where-Object {
                $_ -match '(?i)(?:\busage\b|\bunknown\b|\binvalid\b|\berror\b|\bfailed\b|license agreement|end user license)'
              }
            ).Count -gt 0
            if (-not $acceptedExitCode -or -not $hasCanonicalNoMatch -or $hasPreflightError) {
              throw "Handle preflight did not return the exact canonical no-match line with exit code 0 or 1 (exit=$($probeProcess.ExitCode))."
            }
          } finally {
            $probeProcess.Dispose()
          }
          Write-Host 'Handle selected -a and object-name search arguments passed the bounded binary preflight.'
          "handle_exe=$([IO.Path]::GetFullPath($handleExecutable))" >> $env:GITHUB_OUTPUT

      - name: Smoke-test the final portable .7z archive with Handle diagnostics
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.lock_diagnostics }}
        shell: pwsh
        env:
          PDF_SCRUBBER_HANDLE_EXE: ${{ steps.handle.outputs.handle_exe }}
        run: |
          $archives = @(Get-ChildItem -LiteralPath 'artifacts/desktop/output' -Filter '*.7z' -File)
          if ($archives.Count -ne 1) { throw "Expected one final portable .7z archive, found $($archives.Count)." }
          $archive = $archives[0]
          $fixture = (Resolve-Path 'fixtures/generated/01-simple-tj.pdf').Path
          npm run desktop:smoke -- --archive "$($archive.FullName)" --fixture "$fixture"
          if ($LASTEXITCODE -ne 0) { throw 'Portable archive smoke failed.' }

      - name: Smoke-test the final portable .7z archive without Handle diagnostics
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.lock_diagnostics == false }}
        shell: pwsh
        run: |
          $archives = @(Get-ChildItem -LiteralPath 'artifacts/desktop/output' -Filter '*.7z' -File)
          if ($archives.Count -ne 1) { throw "Expected one final portable .7z archive, found $($archives.Count)." }
          $archive = $archives[0]
          $fixture = (Resolve-Path 'fixtures/generated/01-simple-tj.pdf').Path
          npm run desktop:smoke -- --archive "$($archive.FullName)" --fixture "$fixture"
          if ($LASTEXITCODE -ne 0) { throw 'Portable archive smoke failed.' }

      - name: Finalise tested portable archive assets
        shell: pwsh
        run: |
          $archives = @(Get-ChildItem -LiteralPath 'artifacts/desktop/output' -Filter '*.7z' -File)
          if ($archives.Count -ne 1) { throw "Expected one final portable .7z archive, found $($archives.Count)." }
          $archive = $archives[0]
          $hash = (Get-FileHash -LiteralPath $archive.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($archive.Name)" | Out-File -LiteralPath "$($archive.FullName).sha256" -Encoding ascii

      - name: Clean up task-owned Handle download
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.lock_diagnostics }}
        shell: pwsh
        env:
          HANDLE_TEMP_ROOT: ${{ steps.handle.outputs.cleanup_root }}
        run: |
          if (-not [string]::IsNullOrWhiteSpace($env:HANDLE_TEMP_ROOT)) {
            $ownedRoot = [IO.Path]::GetFullPath($env:HANDLE_TEMP_ROOT)
            $expectedName = "pdf-scrubber-handle-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
            $expectedRoot = [IO.Path]::GetFullPath((Join-Path $env:RUNNER_TEMP $expectedName))
            if (-not $ownedRoot.Equals($expectedRoot, [StringComparison]::OrdinalIgnoreCase)) {
              throw 'Refusing to clean a Handle path outside this run-owned RUNNER_TEMP subtree.'
            }
            if (Test-Path -LiteralPath $ownedRoot) {
              Remove-Item -LiteralPath $ownedRoot -Recurse -Force -ErrorAction Stop
            }
          }

      - name: Upload tested portable build artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.identities.outputs.artifact_name }}
          path: |
            artifacts/desktop/output/*.7z
            artifacts/desktop/output/*.7z.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  attach-release:
    if: ${{ github.event_name == 'release' && !github.event.release.prerelease }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download tested desktop assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: release-assets

      - name: Verify release identity, checksum, and asset names; attach without overwrite
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build.outputs.editor_tag }}
          RELEASE_SHA: ${{ github.sha }}
          EDITOR_SHA: ${{ needs.build.outputs.editor_sha }}
          PACKAGING_SHA: ${{ needs.build.outputs.packaging_sha }}
        run: |
          set -euo pipefail
          [[ "$EDITOR_SHA" == "$RELEASE_SHA" ]]
          [[ "$PACKAGING_SHA" == "$RELEASE_SHA" ]]

          mapfile -t archives < <(printf '%s\n' release-assets/*.7z)
          [[ ${#archives[@]} -eq 1 && -f "${archives[0]}" ]]
          archive=${archives[0]}
          mapfile -t checksums < <(printf '%s\n' release-assets/*.7z.sha256)
          [[ ${#checksums[@]} -eq 1 && -f "${checksums[0]}" ]]
          checksum="${archive}.sha256"
          [[ "$checksum" == "${checksums[0]}" && -f "$checksum" ]]
          actual_hash=$(sha256sum "$archive" | awk '{ print $1 }')
          expected_checksum="$actual_hash  $(basename "$archive")"
          if ! printf '%s\n' "$expected_checksum" | cmp -s - "$checksum" &&
             ! printf '%s\r\n' "$expected_checksum" | cmp -s - "$checksum"; then
            printf 'Release checksum sidecar does not match the archive.\n' >&2
            exit 1
          fi

          existing_assets=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
          for asset in "$archive" "$checksum"; do
            name=$(basename "$asset")
            if printf '%s\n' "$existing_assets" | awk -v name="$name" '$0 == name { found = 1 } END { exit !found }'; then
              printf 'Refusing to overwrite existing release asset: %s\n' "$name" >&2
              exit 1
            fi
          done

          gh release upload "$RELEASE_TAG" "$archive" "$checksum" \
            --repo "$GITHUB_REPOSITORY"
