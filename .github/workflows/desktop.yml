name: Windows portable

on:
  workflow_dispatch:
    inputs:
      editor_tag:
        description: Stable editor tag to package (for example, v1.0.0)
        required: true
        type: string
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.event.release.tag_name || inputs.editor_tag || github.sha }}
  cancel-in-progress: false

jobs:
  build:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'release' && !github.event.release.prerelease) }}
    runs-on: windows-latest
    permissions:
      contents: read
    outputs:
      editor_tag: ${{ steps.identities.outputs.editor_tag }}
      editor_version: ${{ steps.identities.outputs.editor_version }}
      editor_sha: ${{ steps.identities.outputs.editor_sha }}
      packaging_sha: ${{ steps.identities.outputs.packaging_sha }}
      artifact_name: ${{ steps.identities.outputs.artifact_name }}
    steps:
      - name: Check out packaging revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Resolve and validate editor tag
        id: tag
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_TAG: ${{ inputs.editor_tag }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if ($env:EVENT_NAME -eq 'release') {
            $tag = $env:RELEASE_TAG
          } else {
            $tag = $env:DISPATCH_TAG
          }
          if ($tag -notmatch '^v((0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*))$') {
            throw 'Editor tag must be an unprefixed stable vMAJOR.MINOR.PATCH tag.'
          }
          "editor_tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Check out tagged editor source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ steps.tag.outputs.editor_tag }}
          path: editor-source
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.18.0'

      - name: Resolve and verify source identities
        id: identities
        shell: pwsh
        working-directory: editor-source
        env:
          EDITOR_TAG: ${{ steps.tag.outputs.editor_tag }}
          EVENT_NAME: ${{ github.event_name }}
          EXPECTED_RELEASE_SHA: ${{ github.sha }}
        run: |
          $packagingSha = (git -C $env:GITHUB_WORKSPACE rev-parse HEAD).Trim()
          $editorHead = (git rev-parse HEAD).Trim()
          $editorSha = (git rev-parse "refs/tags/$env:EDITOR_TAG^{commit}").Trim()
          if ($editorHead -ne $editorSha) {
            throw 'The editor checkout does not match the selected tag target.'
          }
          $editorVersion = (node -p "require('./apps/cli/package.json').version").Trim()
          if ("v$editorVersion" -ne $env:EDITOR_TAG) {
            throw "Editor tag $env:EDITOR_TAG does not match apps/cli/package.json version $editorVersion."
          }
          if ($env:EVENT_NAME -eq 'release' -and (
            $editorSha -ne $env:EXPECTED_RELEASE_SHA -or $packagingSha -ne $env:EXPECTED_RELEASE_SHA
          )) {
            throw 'Stable release packaging and editor sources must both match the published release SHA.'
          }
          $artifactName = "pdf-scrubber-$editorVersion-windows-x64-portable"
          "editor_tag=$env:EDITOR_TAG" >> $env:GITHUB_OUTPUT
          "editor_version=$editorVersion" >> $env:GITHUB_OUTPUT
          "editor_sha=$editorSha" >> $env:GITHUB_OUTPUT
          "packaging_sha=$packagingSha" >> $env:GITHUB_OUTPUT
          "artifact_name=$artifactName" >> $env:GITHUB_OUTPUT

      - name: Install desktop wrapper dependencies
        working-directory: .
        run: npm ci

      - name: Generate synthetic product smoke fixtures
        working-directory: .
        run: npm run build:fixtures

      - name: Install tagged editor dependencies
        working-directory: editor-source
        run: npm ci

      - name: Build editor assets from selected tag
        working-directory: editor-source
        run: npm run build --workspace @pdf-editor/web -- --outDir ../../artifacts/desktop/editor-assets --emptyOutDir

      - name: Prepare desktop package and provenance
        shell: pwsh
        env:
          EDITOR_TAG: ${{ steps.identities.outputs.editor_tag }}
          EDITOR_VERSION: ${{ steps.identities.outputs.editor_version }}
          EDITOR_SHA: ${{ steps.identities.outputs.editor_sha }}
          PACKAGING_SHA: ${{ steps.identities.outputs.packaging_sha }}
        run: |
          $editorAssets = Join-Path $env:GITHUB_WORKSPACE 'editor-source/artifacts/desktop/editor-assets'
          npm run desktop:prepare -- --editor-assets $editorAssets --editor-tag $env:EDITOR_TAG --editor-version $env:EDITOR_VERSION --editor-sha $env:EDITOR_SHA --packaging-sha $env:PACKAGING_SHA --output artifacts/desktop/package-input
          if ($LASTEXITCODE -ne 0) { throw 'Desktop packaging preparation failed.' }

      - name: Build unsigned Windows x64 portable executable
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run build:portable --workspace @pdf-editor/desktop

      - name: Smoke-test the final portable .7z archive and finalise assets
        shell: pwsh
        run: |
          $archives = @(Get-ChildItem -LiteralPath 'artifacts/desktop/output' -Filter '*.7z' -File)
          if ($archives.Count -ne 1) { throw "Expected one final portable .7z archive, found $($archives.Count)." }
          $archive = $archives[0]
          $fixture = (Resolve-Path 'fixtures/generated/01-simple-tj.pdf').Path
          npm run desktop:smoke -- --archive "$($archive.FullName)" --fixture "$fixture"
          if ($LASTEXITCODE -ne 0) { throw 'Portable archive smoke failed.' }
          Copy-Item -LiteralPath 'artifacts/desktop/package-input/provenance.json' `
            -Destination 'artifacts/desktop/output/provenance.json' -Force
          $hash = (Get-FileHash -LiteralPath $archive.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($archive.Name)" | Out-File -LiteralPath "$($archive.FullName).sha256" -Encoding ascii

      - name: Upload tested portable build artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.identities.outputs.artifact_name }}
          path: |
            artifacts/desktop/output/*.7z
            artifacts/desktop/output/*.7z.sha256
            artifacts/desktop/output/provenance.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  attach-release:
    if: ${{ github.event_name == 'release' && !github.event.release.prerelease }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download tested desktop assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: release-assets

      - name: Verify release identity, checksum, and asset names; attach without overwrite
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build.outputs.editor_tag }}
          RELEASE_SHA: ${{ github.sha }}
          EDITOR_SHA: ${{ needs.build.outputs.editor_sha }}
          PACKAGING_SHA: ${{ needs.build.outputs.packaging_sha }}
        run: |
          set -euo pipefail
          [[ "$EDITOR_SHA" == "$RELEASE_SHA" ]]
          [[ "$PACKAGING_SHA" == "$RELEASE_SHA" ]]
          jq -e --arg tag "$RELEASE_TAG" --arg editor "$EDITOR_SHA" --arg packaging "$PACKAGING_SHA" \
            '.editor.tag == $tag and .editor.sha == $editor and .packaging.sha == $packaging' \
            release-assets/provenance.json >/dev/null

          mapfile -t archives < <(printf '%s\n' release-assets/*.7z)
          [[ ${#archives[@]} -eq 1 && -f "${archives[0]}" ]]
          archive=${archives[0]}
          mapfile -t checksums < <(printf '%s\n' release-assets/*.7z.sha256)
          [[ ${#checksums[@]} -eq 1 && -f "${checksums[0]}" ]]
          checksum="${archive}.sha256"
          [[ "$checksum" == "${checksums[0]}" && -f "$checksum" ]]
          expected_hash=$(awk 'NR == 1 { print $1 }' "$checksum")
          expected_name=$(awk 'NR == 1 { print $2 }' "$checksum")
          actual_hash=$(sha256sum "$archive" | awk '{ print $1 }')
          [[ "$expected_hash" == "$actual_hash" && "$expected_name" == "$(basename "$archive")" ]]

          existing_assets=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
          for asset in "$archive" "$checksum" release-assets/provenance.json; do
            name=$(basename "$asset")
            if printf '%s\n' "$existing_assets" | awk -v name="$name" '$0 == name { found = 1 } END { exit !found }'; then
              printf 'Refusing to overwrite existing release asset: %s\n' "$name" >&2
              exit 1
            fi
          done

          gh release upload "$RELEASE_TAG" "$archive" "$checksum" release-assets/provenance.json \
            --repo "$GITHUB_REPOSITORY"
